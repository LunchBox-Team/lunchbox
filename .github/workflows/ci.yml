name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Check the page
        run: sh hooks/check-page.sh
      - name: Check the JavaScript syntax
        run: for f in *.js; do node --check "$f"; done
      - name: Run the tests
        run: node --test