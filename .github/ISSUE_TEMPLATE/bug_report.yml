name: Bug report
description: Something in LunchBox isn't working
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: And what did you expect to happen?
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Which page?
      placeholder: Menu, cart or order history